[project]
name = "pwn-mcp-server"
version = "0.1.0"
description = "MCP server for querying and visualizing pulsar wind nebulae and other nebulae, with CIE 1931/1964 colorimetry of nebular spectra"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Wouter Deconinck", email = "wouter.deconinck@umanitoba.ca" }]
dependencies = [
    "mcp[cli]>=2.3,<3",
    "numpy>=1.26",
    "astropy>=6.0",
    "astroquery>=0.4.9",
    "pyvo>=1.5",
    "psrqpy>=1.2",
    "matplotlib>=3.8",
    "colour-science>=0.4.4",
    "platformdirs>=4.0",
]

[project.scripts]
pwn-mcp = "pwn_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwn_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that contact remote astronomy services (run with -m network)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"
